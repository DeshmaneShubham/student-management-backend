spring.application.name=StudentManagement

# 1. The Connection URL (Change 'my_app_db' to your actual database name)
spring.datasource.url=jdbc:mysql://localhost:3306/StudentCrud

# 2. Your MySQL Username (Default is usually 'root')
spring.datasource.username=root

# 3. Your MySQL Password (TYPE YOUR ACTUAL PASSWORD HERE)
spring.datasource.password=4321
# 4. Driver Config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 5. Hibernate Settings (Create tables automatically)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect